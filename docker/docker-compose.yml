services:

  postgres-keycloak:
    image: postgres:15
    container_name: postgres-keycloak
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5433:5432"
    volumes:
      - keycloak_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: 
      - start 
      - --hostname=http://keycloak:8080
      - --http-enabled=true
      - --hostname-strict=false
      - --import-realm

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    
    ports:
      - "8084:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      postgres-keycloak:
        condition: service_healthy


  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json  
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-book:
    image: mysql:8
    container_name: mysql-book
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: book_db
      MYSQL_USER: libraryApp
      MYSQL_PASSWORD: libraryAppTest!
    ports:
      - "3307:3306"
    volumes:
      - ./mysql-book:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-loan:
    image: mysql:8
    container_name: mysql-loan
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: loan_db
      MYSQL_USER: libraryApp
      MYSQL_PASSWORD: libraryAppTest!
    ports:
      - "3308:3306"
    volumes:
      - ./mysql-loan:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-user:
    image: mysql:8
    container_name: mysql-user
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user_db
      MYSQL_USER: libraryApp
      MYSQL_PASSWORD: libraryAppTest!
    ports:
      - "3309:3306"
    volumes:
      - ./mysql-user:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 10

  book-service:
    build: ../book-service
    container_name: book-service
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-book:3306/book_db
      SPRING_DATASOURCE_USERNAME: libraryApp
      SPRING_DATASOURCE_PASSWORD: libraryAppTest!
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      mysql-book:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      keycloak:
        condition: service_started
      
  loan-service:
    build: ../loan-service
    container_name: loan-service
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-loan:3306/loan_db
      SPRING_DATASOURCE_USERNAME: libraryApp
      SPRING_DATASOURCE_PASSWORD: libraryAppTest!
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      mysql-loan:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      keycloak:
        condition: service_started

  user-service:
    build: ../user-service
    container_name: user-service
    ports:
      - "8083:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-user:3306/user_db
      SPRING_DATASOURCE_USERNAME: libraryApp
      SPRING_DATASOURCE_PASSWORD: libraryAppTest!
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      mysql-user:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      keycloak:
        condition: service_started

  api-gateway:
    build: ../api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      book-service:
        condition: service_started
      loan-service:
        condition: service_started
      user-service:
        condition: service_started
      keycloak:
        condition: service_started

volumes:
  keycloak_db:
  keycloak_data:
