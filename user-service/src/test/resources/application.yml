spring:
  datasource:
    url: jdbc:h2:mem:test-${random.uuid}
    driver-class-name: org.h2.Driver
    username: admin
    password: admin

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.type.json_format_mapper: mentoring.acomi.userservice.infrastructure.persistence.configuration.Jackson3HibernateJsonFormatMapper

  h2:
    console:
      enabled: true

keycloak:
  base-url: http://localhost:8084
  admin-realm: master
  realm: library-microservices
  admin-client-id: user-service-admin
  admin-client-secret: test-secret