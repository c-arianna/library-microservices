spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: admin
    password: admin

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.type.json_format_mapper: mentoring.acomi.userservice.infrastructure.persistence.configuration.Jackson3HibernateJsonFormatMapper

  h2:
    console:
      enabled: true
      
  security:
    jwt:
      enabled: true
      issuer: user-service
      secret: ${JWT_SECRET:d6ISU26dwuewuDCpql4e0kJkCNM5WmrggGtnoqQ35VU=}
      access-token-expiration-minutes: 15
      refresh-token-expiration-days: 7