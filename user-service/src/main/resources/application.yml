spring:
  application:
    name: user-service    
    
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/user_db}
    username: ${SPRING_DATASOURCE_USERNAME:libraryApp}
    password: ${SPRING_DATASOURCE_PASSWORD:libraryAppTest!}
    driver-class-name: com.mysql.cj.jdbc.Driver

  hikari:
    maximumPoolSize: 10
    minimumIdle: 2
    initializationFailTimeout: 0
    connectionTimeout: 30000
    validationTimeout: 5000

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.type.json_format_mapper: mentoring.acomi.userservice.infrastructure.persistence.configuration.Jackson3HibernateJsonFormatMapper
      
  security:
    user:
      name: none
      password: none
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/library-microservices/protocol/openid-connect/certs

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: libraryApp
    password: libraryAppTest!
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true

  sql:
    init:
      continue-on-error: true

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0

keycloak:
  base-url: ${KEYCLOAK_BASE_URL:http://localhost:8084}
  admin-realm: ${KEYCLOAK_ADMIN_REALM:library-microservices}
  realm: ${KEYCLOAK_REALM:library-microservices}
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:user-service-admin}
  admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:default-secret}