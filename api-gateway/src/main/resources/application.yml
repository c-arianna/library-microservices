server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:

          - id: auth-service
            uri: http://localhost:8081
            predicates:
              - Path=/auth/**
              
          - id: user-service
            uri: http://localhost:8081
            predicates:
              - Path=/users, /users/**
            filters:
              - StripPrefix=1

          - id: book-service
            uri: http://localhost:8082
            predicates:
              - Path=/books, /books/**
            filters:
              - StripPrefix=1

          - id: loan-service
            uri: http://localhost:8083
            predicates:
              - Path=/loans, /loans/**
            filters:
              - StripPrefix=1

  security:
    jwt:
      enabled: true
      issuer: user-service
      secret: ${JWT_SECRET:d6ISU26dwuewuDCpql4e0kJkCNM5WmrggGtnoqQ35VU=}
      access-token-expiration-minutes: 15
      refresh-token-expiration-days: 7

    user:
      name: none
      password: none