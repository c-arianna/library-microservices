server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:

          - id: auth-service
            uri: http://localhost:8081
            predicates:
              - Path=/auth/**
              
          - id: user-service
            uri: http://localhost:8081
            predicates:
              - Path=/users, /users/**
            filters:
              - StripPrefix=1

          - id: book-service
            uri: http://localhost:8082
            predicates:
              - Path=/books, /books/**
            filters:
              - StripPrefix=1

          - id: loan-service
            uri: http://localhost:8083
            predicates:
              - Path=/loans, /loans/**
            filters:
              - StripPrefix=1