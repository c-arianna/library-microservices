spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:

          - id: auth-service
            uri: http://user-service:8080
            predicates:
              - Path=/auth/**
              
          - id: user-service
            uri: http://user-service:8080
            predicates:
              - Path=/users, /users/**
            filters:
              - StripPrefix=1

          - id: book-service
            uri: http://book-service:8080
            predicates:
              - Path=/books, /books/**
            filters:
              - StripPrefix=1

          - id: loan-service
            uri: http://loan-service:8080
            predicates:
              - Path=/loans, /loans/**
            filters:
              - StripPrefix=1

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/library-microservices

    user:
      name: none
      password: none

  reactor:
    context-propagation: auto

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0