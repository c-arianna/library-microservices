spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:

          - id: user-service
            uri: ${USER_SERVICE_URL:http://user-service:8080}
            predicates:
              - Path=/users, /users/**
            filters:
              - StripPrefix=1

          - id: book-service
            uri: ${BOOK_SERVICE_URL:http://book-service:8080}
            predicates:
              - Path=/books, /books/**
            filters:
              - StripPrefix=1

          - id: loan-service
            uri: ${LOAN_SERVICE_URL:http://loan-service:8080}
            predicates:
              - Path=/loans, /loans/**
            filters:
              - StripPrefix=1

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8084/realms/library-microservices

    user:
      name: none
      password: none

  reactor:
    context-propagation: auto

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0