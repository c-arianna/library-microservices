spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: admin
    password: admin

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.type.json_format_mapper: mentoring.acomi.bookservice.infrastructure.persistence.configuration.Jackson3HibernateJsonFormatMapper

  h2:
    console:
      enabled: true
